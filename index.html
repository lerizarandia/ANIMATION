<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIMATION</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <section>
            <h2>ball is moveing</h2>
            <div class="shape ball"></div>
        </section>
        <section>
            <h2>color and size</h2>
            <div class="shape box"></div>
        </section>
        <section>
            <h2>text appear</h2>
            <p class="text">this is text</p>
        </section>
        <section>
            <h2>spin</h2>
            <div class="loader"></div>
        </section>
        <section>
            <h2>pulse and stop</h2>
            <button class="pulse"> stop me</button>
        </section>
        <section>
            <h2>double animation</h2>
            <div class="shape double"></div>
        </section>
        <section>
            <h2>jumping ball</h2>
            <div class="stage">
                <div class="shape bounce-ball"></div>
            </div>
        </section>
        <section>
            <h2>shake</h2>
            <button class="shake-button">error </button>
        </section>
        <section>
            <h2>form change</h2>
            <div class="shape form-change"></div>
        </section>
        <section>
            <h2>flip card</h2>
            <div class="flip-scene">
                <div class="flip-card">CARD</div>
            </div>
        </section>
        <section>
            <h2>linear gradient</h2>
            <div class="gradient-box">COLORS ARE CHANGEING</div>
        </section>
        <section>
            <h2>dots</h2>
            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </section>
    </main>
</body>
</html>
